# Install with: uv run --with pre-commit pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.(gif|png|svg)$
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-added-large-files
        args: [--maxkb=2048]
